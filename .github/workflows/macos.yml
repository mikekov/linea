name: macOS build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Homebrew .pc files bake in the CLT SDK; point xcode-select at it so
      # brew's SDKROOT and xcrun's SDK agree (configure.sh hard-fails otherwise).
      - name: Select CLT toolchain
        run: sudo xcode-select -s /Library/Developer/CommandLineTools

      # Bottle downloads are the slow part of brew install; cache them.
      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ hashFiles('.github/workflows/macos.yml') }}
          restore-keys: |
            brew-${{ runner.os }}-

      # ccache stores its data in ~/Library/Caches/ccache; caching it makes
      # incremental rebuilds across runs cheap. configure.sh enables the
      # compiler launchers automatically when ccache is installed.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install dependencies
        run: |
          brew install \
              bdw-gc \
              boost \
              cairo \
              cairomm \
              ccache \
              cmake \
              double-conversion \
              dylibbundler \
              gettext \
              glibmm \
              gsl \
              icu4c \
              imagemagick \
              lcms2 \
              libepoxy \
              libxslt \
              meson \
              ninja \
              pango \
              pangomm \
              pkg-config \
              poppler \
              potrace \
              qt6
          # gettext is keg-only; without --force brew link refuses and the
          # Intl package is never found. Fail loudly rather than || true.
          brew link --force gettext

      - name: Configure
        run: |
          export PKG_CONFIG_PATH="$PKG_CONFIG_PATH:$(brew --prefix)/opt/libxslt/lib/pkgconfig"
          export PKG_CONFIG_PATH="$PKG_CONFIG_PATH:$(brew --prefix)/opt/libxml2/lib/pkgconfig"
          ./configure.sh -r

      - name: Build
        run: ninja -C build-release -k 0

      - name: ccache stats
        if: always()
        run: ccache -s

      - name: Package app bundle
        # macdeployqt misses QtSvg references on the first pass; run install
        # twice as documented in doc/build-macos.md.
        run: |
          ninja -C build-release install
          ninja -C build-release install

      - name: Verify bundle is relocatable
        # Every LC_LOAD_DYLIB ref inside the bundle must resolve: /opt/homebrew
        # means a dep wasn't bundled; a dangling @executable_path/@rpath ref
        # crashes at launch (dyld "Library not loaded").
        run: |
          python3 - <<'PYEOF'
          import os, re, subprocess, sys

          app = "build-release/install/linea.app"
          exe_dir = os.path.join(app, "Contents", "MacOS")
          frameworks = os.path.join(app, "Contents", "Frameworks")
          bad = False

          for root, _, files in os.walk(app):
              for name in files:
                  f = os.path.join(root, name)
                  out = subprocess.run(["otool", "-L", f],
                                       capture_output=True, text=True).stdout
                  for ref in re.findall(r"@(?:executable|loader|r)path/\S+|/opt/\S+|/usr/local/\S+", out):
                      if "/opt/" in ref or "/usr/local/" in ref:
                          ok = False  # unbundled external dep
                      elif ref.startswith("@rpath/"):
                          ok = os.path.exists(os.path.join(frameworks, ref[7:]))
                      elif ref.startswith("@loader_path/"):
                          ok = os.path.exists(os.path.join(root, ref[13:]))
                      else:
                          ok = os.path.exists(os.path.join(exe_dir, ref[17:]))
                      if not ok:
                          print(f"::error file={f}::unresolved {ref}")
                          bad = True

          sys.exit(1 if bad else 0)
          PYEOF

      # dylibbundler/install_name_tool rewrites invalidate signatures; a
      # stale ad-hoc signature is a launch-time crash (CODESIGNING Invalid
      # Page) that otool checks can't see.
      - name: Verify bundle signature
        run: codesign --verify --deep --strict build-release/install/linea.app

      - name: Archive app bundle
        # ditto preserves symlinks inside the bundle (Qt frameworks depend on
        # them); a plain zip flattens them and breaks the app.
        run: |
          cd build-release/install
          ditto -c -k --sequesterRsrc --keepParent linea.app linea.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: linea-macos15
          path: build-release/install/linea.zip
          if-no-files-found: error

      # Release assets are publicly downloadable (artifacts require login).
      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-release/install/linea.zip
