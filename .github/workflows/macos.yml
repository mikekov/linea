name: macOS build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Homebrew .pc files bake in the CLT SDK; point xcode-select at it so
      # brew's SDKROOT and xcrun's SDK agree (configure.sh hard-fails otherwise).
      - name: Select CLT toolchain
        run: sudo xcode-select -s /Library/Developer/CommandLineTools

      # Bottle downloads are the slow part of brew install; cache them.
      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ hashFiles('.github/workflows/macos.yml') }}
          restore-keys: |
            brew-${{ runner.os }}-

      # ccache stores its data in ~/Library/Caches/ccache; caching it makes
      # incremental rebuilds across runs cheap. configure.sh enables the
      # compiler launchers automatically when ccache is installed.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install dependencies
        run: |
          brew install \
              bdw-gc \
              boost \
              cairo \
              cairomm \
              ccache \
              cmake \
              double-conversion \
              gettext \
              glibmm \
              gsl \
              icu4c \
              imagemagick \
              lcms2 \
              libepoxy \
              libxslt \
              meson \
              ninja \
              pango \
              pangomm \
              pkg-config \
              poppler \
              potrace \
              qt6
          # gettext is keg-only; without --force brew link refuses and the
          # Intl package is never found. Fail loudly rather than || true.
          brew link --force gettext

      - name: Configure
        run: |
          export PKG_CONFIG_PATH="$PKG_CONFIG_PATH:$(brew --prefix)/opt/libxslt/lib/pkgconfig"
          export PKG_CONFIG_PATH="$PKG_CONFIG_PATH:$(brew --prefix)/opt/libxml2/lib/pkgconfig"
          ./configure.sh -r

      - name: Build
        run: ninja -C build-release -k 0

      - name: ccache stats
        if: always()
        run: ccache -s

      - name: Package app bundle
        # macdeployqt misses QtSvg references on the first pass; run install
        # twice as documented in doc/build-macos.md.
        run: |
          ninja -C build-release install
          ninja -C build-release install

      - name: Verify bundle is relocatable
        # Any /opt/homebrew reference means macdeployqt missed a dependency;
        # the app would launch on this runner but break on user machines.
        run: |
          cd build-release/install
          bad=0
          while IFS= read -r f; do
            if otool -L "$f" 2>/dev/null | grep -q /opt/homebrew; then
              echo "::error file=$f::references /opt/homebrew, not bundled"
              bad=1
            fi
          done < <(find linea.app -type f)
          exit "$bad"

      - name: Archive app bundle
        # ditto preserves symlinks inside the bundle (Qt frameworks depend on
        # them); a plain zip flattens them and breaks the app.
        run: |
          cd build-release/install
          ditto -c -k --sequesterRsrc --keepParent linea.app linea.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: linea-macos15
          path: build-release/install/linea.zip
          if-no-files-found: error
